schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-d02
  title: translate_text 错误率反复波动
  category: connection_failure
  difficulty: adversarial
  tags: [connection, recurrence, recovery_interrupt, two_cycles]

clock:
  start_at: 2026-09-14T10:00:00Z
  tick: 1m
  end_after: 60m

initial_state:
  service:
    id: translate-service
    tool: translate_text
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2000
      cost_per_success_max: 0.02
    routes:
      - id: route-a
        provider: provider-tr-a
        weight: 70
        enabled: true
      - id: route-b
        provider: provider-tr-b
        weight: 30
        enabled: true
  providers:
    - id: provider-tr-a
      health: healthy
      endpoint: api.tr-a.example
    - id: provider-tr-b
      health: healthy
      endpoint: api.tr-b.example
  traffic:
    requests_per_minute: 100
    success_rate: 0.99
    latency_p95_ms: 700
    cost_per_success: 0.015
  connection:
    provider-tr-a:
      pool_generation: 8
      resolver_cache_generation: 3
      resolved_ip: 198.51.100.10

controller:
  detection_policy:
    window: 4m
    min_requests: 100
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    redistribute_to: route-b
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 1
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2000
      cost_per_success_lte: 0.02
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      connection_refused: true

agent_policy:
  remediation_cycle_limit: 3
  incident_time_limit: 50m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed
    - blast_radius_expanding

timeline:
  - at: 5m
    event: provider.endpoint.change
    target: provider-tr-a
    values:
      endpoint: api.tr-a.example
      internal_cause: endpoint_rehome_dns_rettl
      internal_effect:
        route: route-a
        current_provider_ip: 198.51.100.77
        connector_resolved_ip: 198.51.100.10
        success_rate: 0.55
        error_type: connection_refused
      telemetry:
        logs:
          - level: error
            component: provider-connector
            code: connection_refused
            message: dial tcp 198.51.100.10:443 connection refused
        traces:
          - id: trace-v3-d02-001
            route: route-a
            terminal_span: provider.connect
            peer_address: 198.51.100.10
        provider_metadata:
          endpoint: api.tr-a.example
          endpoint_health: healthy
  - at: 8m
    event: provider.endpoint.change
    target: provider-tr-a
    values:
      endpoint: api.tr-a.example
      internal_cause: second_rehome_overloaded_node
      internal_effect:
        route: route-a
        current_provider_ip: 198.51.100.99
        connector_resolved_ip: 198.51.100.77
        success_rate: 0.45
        error_type: connection_refused
      telemetry:
        logs:
          - level: error
            component: provider-connector
            code: connection_refused
            message: dial tcp 198.51.100.77:443 connection refused
        traces:
          - id: trace-v3-d02-002
            route: route-a
            terminal_span: provider.connect
            peer_address: 198.51.100.77
        provider_metadata:
          endpoint: api.tr-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_connection_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: refresh_provider_connection
    description: 重新打开 Provider 的现有连接池并重新解析端点。适合作为连接失败时的低风险首次修复；提交时校验 expected_pool_generation 与当前代次一致。
    risk: low
    requires_approval: false
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      reopen_existing_pool: true
    compensating_action: restore_previous_pool
  - name: recreate_provider_connection_pool
    description: 重建 Provider 连接池并清理进程内 DNS 缓存。仅在刷新连接后的探测仍失败且出现新证据时使用；提交时校验 expected_pool_generation。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    preconditions:
      refresh_failed_probe_required: true
    effect:
      create_new_pool: true
      clear_process_dns_cache: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复完成后必须通过探测验证；恢复期健康窗口失败时控制器会把路由退回保护权重并交回 Agent。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  refresh_provider_connection:
    result: success
    completion_delay: 1m
    world_effect:
      pool_generation: 9
      resolver_cache_generation: 4
      resolved_ip: 198.51.100.77
      success_rate: 0.99
      latency_p95_ms: 720
      error_type_cleared: connection_refused
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 10
      resolver_cache_generation: 5
      resolved_ip: 198.51.100.99
      success_rate: 0.99
      latency_p95_ms: 720
      error_type_cleared: connection_refused
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 60
            success_rate: 0.55
            latency_p95_ms: 700
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: [connection_refused]
      - when: {after_world_effect: refresh_provider_connection}
        steps:
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 720
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: []
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 720
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: []
      - when: {after_event: {event: provider.endpoint.change, target: provider-tr-a, cause: second_rehome_overloaded_node}}
        steps:
          - sample_count: 60
            success_rate: 0.45
            latency_p95_ms: 700
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: [connection_refused]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: provider-connector
                  code: resolver_cache_hit
                  message: connection pool generation 9 rebuilt on resolver cache generation 4 which still resolves 198.51.100.77
      - when: {after_world_effect: recreate_provider_connection_pool}
        steps:
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 720
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: []
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 720
            cost_per_success: 0.015
            telemetry_complete: true
            error_types: []
  # 探测/恢复窗口画像在会话创建时冻结：二次 rehome（8m）落在健康探测的窗口
  # 跨度内（探测冻结页仍报 healthy），随后创建的恢复会话按创建时刻的实时快照
  # （0.45）在首个窗口即硬停并退回保护权重；重建后的第二次恢复快照已恢复，全程健康。
  request_recovery:
    result: accepted
    window_duration: 1m
