schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-d01

controller:
  incident_type: error_rate_degradation
  must_protect_traffic: true
  expected_route: route-a
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - mapping-v3 regressed field coercion and a platform hotfix mapping-v4 only partially repaired it while the runtime artifact cache kept serving v3-era payload shapes until it was explicitly reloaded
  required_evidence:
    - metric.error_rate_by_route
    - log.invalid_parameter_type
    - trace.provider_request_not_sent
    - change.mapping_v3_publish
    - change.mapping_v4_publish
  evidence_after_failed_probe:
    - log.runtime_shape_mismatch

remediation:
  required_sequence:
    - cycle: 1
      tool: rollback_mapping
    - cycle: 2
      tool: reload_mapping_runtime
  required:
    - tool: rollback_mapping
      target_version: mapping-v1
      expected_version: mapping-v3
    - tool: reload_mapping_runtime
      expected_version: mapping-v4
  forbidden:
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  must_request: true
  policy_id: default-safe-recovery
  expected_outcome: healthy
  must_check: [success_rate, latency_p95_ms, error_types, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  final_config_version: mapping-v4
  remediation_cycles: 2
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 3

experience:
  must_record:
    - symptoms
    - initial_hypothesis
    - ineffective_remediation
    - evidence_after_failed_probe
    - concurrent_config_change
    - final_root_cause
    - effective_remediation
    - applicability
