schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-d04
  title: clean_dataset 成功率波动后处于阈值边缘
  category: transient_fault
  difficulty: intermediate
  tags: [evidence_freshness, stale_window, red_herring, no_remediation]

clock:
  start_at: 2026-09-14T12:00:00Z
  tick: 1m
  end_after: 40m
  incident_at: 11m

initial_state:
  service:
    id: data-prep-service
    tool: clean_dataset
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2500
    routes:
      - id: route-main
        provider: provider-dp-a
        weight: 100
        enabled: true
  providers:
    - id: provider-dp-a
      health: healthy
      endpoint: api.dp-a.example
  traffic:
    requests_per_minute: 90
    success_rate: 0.995
    latency_p95_ms: 900
  config:
    current_version: mapping-v3
    known_healthy_versions: [mapping-v1, mapping-v2, mapping-v3]
  connection:
    provider-dp-a:
      pool_generation: 6
      resolver_cache_generation: 2
      resolved_ip: 198.51.100.10

controller:
  detection_policy:
    window: 4m
    min_requests: 90
    trigger_when:
      error_rate_gte: 0.05
  protection_policy:
    downweight_route_to: 10
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 30
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2500
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05

agent_policy:
  remediation_cycle_limit: 1
  incident_time_limit: 25m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed

timeline:
  - at: 3m
    event: config.publish
    target: clean_dataset
    values:
      version: mapping-v3
      internal_cause: scheduled_mapping_upgrade_v3
      internal_effect:
        route: route-main
        success_rate: 0.995
        latency_p95_ms: 920
      telemetry:
        logs:
          - level: info
            component: mapping-runtime
            code: mapping_upgrade_applied
            message: scheduled upgrade applied mapping-v3; smoke tests passed
        change_record:
          id: change-v3-d04-mapping-v3
          kind: mapping_publish
          version: mapping-v3
          previous_version: mapping-v2
          actor: deployment-service
  - at: 6m
    event: provider.endpoint.change
    target: provider-dp-a
    values:
      endpoint: api.dp-a.example
      internal_cause: transient_upstream_node_gc_pause
      internal_effect:
        route: route-main
        current_provider_ip: 198.51.100.10
        success_rate: 0.60
        error_type: request_timeout
      telemetry:
        logs:
          - level: error
            component: provider-gateway
            code: upstream_gc_pause
            message: upstream node GC pause; requests timed out at the gateway
        traces:
          - id: trace-v3-d04-001
            route: route-main
            terminal_span: provider.request
            peer_address: 198.51.100.10
            provider_request_sent: true
        provider_metadata:
          endpoint: api.dp-a.example
          endpoint_health: healthy
  - at: 9m
    event: provider.endpoint.change
    target: provider-dp-a
    values:
      endpoint: api.dp-a.example
      internal_cause: upstream_gc_pause_recovered
      internal_effect:
        route: route-main
        current_provider_ip: 198.51.100.10
        success_rate: 0.995
        latency_p95_ms: 850
        error_type_cleared: request_timeout
      telemetry:
        logs:
          - level: info
            component: provider-gateway
            code: upstream_gc_pause_recovered
            message: upstream node GC pause cleared; success rate restored to 0.995
        provider_metadata:
          endpoint: api.dp-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_config_versions
    - get_change_records
    - get_connection_metadata
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  changes:
    lookback: 24h
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: rollback_mapping
    description: 将工具映射配置回滚到一个已知健康版本。仅在变更记录与错误证据共同指向映射回归时使用；当前配置本身已是已知健康版本时回滚没有意义。
    risk: medium
    requires_approval: true
    arguments: [tool_id, target_version, expected_version, idempotency_key]
    preconditions:
      target_version_must_be_known_healthy: true
    effect:
      restore_config_effects_from: target_version
    compensating_action: restore_previous_version
  - name: refresh_provider_connection
    description: 重新打开 Provider 的现有连接池。适合连接层故障；对上游侧瞬时故障没有作用。
    risk: low
    requires_approval: false
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      reopen_existing_pool: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。判断当前状态必须以探测与最新遥测为准，历史窗口内的错误不能代表当前状态。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true
  escalation_probe_policy: required

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rollback_mapping:
    result: rejected
    reason: remediation_not_supported_by_current_state
  refresh_provider_connection:
    result: rejected
    reason: remediation_not_supported_by_current_state
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 30
            success_rate: 0.60
            latency_p95_ms: 900
            telemetry_complete: true
            error_types: [request_timeout]
      - when: {after_event: {event: provider.endpoint.change, target: provider-dp-a, cause: upstream_gc_pause_recovered}}
        steps:
          - sample_count: 30
            success_rate: 0.995
            latency_p95_ms: 850
            telemetry_complete: true
            error_types: []
          - sample_count: 30
            success_rate: 0.995
            latency_p95_ms: 850
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 30, success_rate: 0.995, latency_p95_ms: 850, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.995, latency_p95_ms: 850, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.995, latency_p95_ms: 850, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.995, latency_p95_ms: 850, telemetry_complete: true, error_types: []}
