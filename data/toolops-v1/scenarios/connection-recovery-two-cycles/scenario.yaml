schema_version: toolops-scenario/v1.1

metadata:
  id: connection-recovery-two-cycles-001
  title: search_web 路由出现持续连接失败
  category: connection_failure
  difficulty: intermediate
  tags: [connection, retry, probe, reinvestigation]

clock:
  start_at: 2026-08-10T11:00:00Z
  tick: 1m
  end_after: 50m

initial_state:
  service:
    id: search-service
    tool: search_web
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2000
      cost_per_success_max: 0.02
    routes:
      - id: route-a
        provider: provider-search-a
        weight: 70
        enabled: true
      - id: route-b
        provider: provider-search-b
        weight: 30
        enabled: true
  providers:
    - id: provider-search-a
      health: healthy
      endpoint: api.search-a.example
    - id: provider-search-b
      health: healthy
      endpoint: api.search-b.example
  traffic:
    requests_per_minute: 120
    success_rate: 0.99
    latency_p95_ms: 700
    cost_per_success: 0.015
  connection:
    provider-search-a:
      pool_generation: 12
      resolver_cache_generation: 4
      resolved_ip: 192.0.2.10

controller:
  detection_policy:
    window: 4m
    min_requests: 120
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    redistribute_to: route-b
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 100
    healthy_windows_required: 3
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2000
      cost_per_success_lte: 0.02
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      connection_refused: true

agent_policy:
  remediation_cycle_limit: 3
  incident_time_limit: 40m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed
    - blast_radius_expanding

timeline:
  - at: 5m
    event: provider.endpoint.change
    target: provider-search-a
    values:
      endpoint: api.search-a.example
      internal_cause: connector_dns_cache_retained_obsolete_ip
      internal_effect:
        current_provider_ip: 192.0.2.25
        connector_resolved_ip: 192.0.2.10
        success_rate: 0.40
        error_type: connection_refused
      telemetry:
        logs:
          - level: error
            component: provider-connector
            code: connection_refused
            message: dial tcp 192.0.2.10:443 connection refused
        traces:
          - id: trace-connection-001
            route: route-a
            terminal_span: provider.connect
            peer_address: 192.0.2.10
        provider_metadata:
          endpoint: api.search-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_provider_health
    - get_connection_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: refresh_provider_connection
    description: 重新打开 Provider 的现有连接池，不清理进程内 DNS 缓存。适合作为连接失败时的低风险首次修复。
    risk: low
    requires_approval: false
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      reopen_existing_pool: true
      clear_process_dns_cache: false
    compensating_action: restore_previous_pool
  - name: recreate_provider_connection_pool
    description: 重建 Provider 连接池并清理进程内 DNS 缓存。仅在刷新连接后的探测仍失败且出现新证据时使用。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    preconditions:
      refresh_failed_probe_required: true
    effect:
      create_new_pool: true
      clear_process_dns_cache: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复完成后必须通过探测验证，Agent 不能直接指定流量比例。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  refresh_provider_connection:
    result: success
    completion_delay: 1m
    world_effect:
      pool_generation: 13
      resolver_cache_generation: 4
      resolved_ip: 192.0.2.10
      success_rate: 0.40
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 14
      resolver_cache_generation: 5
      resolved_ip: 192.0.2.25
      success_rate: 0.99
      latency_p95_ms: 750
      error_type_cleared: connection_refused
  request_probe:
    result: accepted
    outcome_sequence:
      - outcome: hard_stop
        reason: connection_refused
        reveal_after_failure:
          logs:
            - level: warn
              component: provider-connector
              code: resolver_cache_hit
              message: connection pool generation 13 reused resolver cache generation 4
      - outcome: healthy
