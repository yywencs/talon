schema_version: toolops-scenario/v1.1

metadata:
  id: transient-timeout-recovery-001
  title: fetch_webpage 短暂超时后已由备用节点自愈
  category: transient_fault
  difficulty: adversarial
  tags: [transient, evidence_freshness, probe, no_remediation]

clock:
  start_at: 2026-08-11T13:00:00Z
  tick: 1m
  end_after: 40m

initial_state:
  service:
    id: fetch-service
    tool: fetch_webpage
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 1500
    routes:
      - id: route-a
        provider: provider-fetch-a
        weight: 90
        enabled: true
      - id: route-b
        provider: provider-fetch-b
        weight: 10
        enabled: true
  providers:
    - id: provider-fetch-a
      health: healthy
      endpoint: api.fetch-a.example
    - id: provider-fetch-b
      health: healthy
      endpoint: api.fetch-b.example
  traffic:
    requests_per_minute: 150
    success_rate: 0.995
    latency_p95_ms: 600
  connection:
    provider-fetch-a:
      pool_generation: 7
      resolver_cache_generation: 2
      resolved_ip: 198.51.100.20

controller:
  detection_policy:
    window: 4m
    min_requests: 150
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    redistribute_to: route-b
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 100
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 1500
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      connection_refused: true

agent_policy:
  remediation_cycle_limit: 2
  incident_time_limit: 30m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - blast_radius_expanding

timeline:
  - at: 5m
    event: provider.endpoint.change
    target: provider-fetch-a
    values:
      endpoint: api.fetch-a.example
      internal_cause: upstream_node_hardware_blip
      internal_effect:
        current_provider_ip: 198.51.100.77
        connector_resolved_ip: 198.51.100.20
        success_rate: 0.55
        error_type: connection_refused
      telemetry:
        logs:
          - level: error
            component: provider-connector
            code: connection_refused
            message: dial tcp 198.51.100.20:443 connection refused
        traces:
          - id: trace-transient-001
            route: route-a
            terminal_span: provider.connect
            peer_address: 198.51.100.20
        provider_metadata:
          endpoint: api.fetch-a.example
          endpoint_health: healthy
  - at: 12m
    event: provider.endpoint.change
    target: provider-fetch-a
    values:
      endpoint: api.fetch-a.example
      internal_cause: standby_node_promoted_by_platform
      internal_effect:
        current_provider_ip: 198.51.100.20
        connector_resolved_ip: 198.51.100.20
        success_rate: 0.99
        latency_p95_ms: 620
        error_type_cleared: connection_refused
      telemetry:
        logs:
          - level: info
            component: provider-connector
            code: standby_failover_completed
            message: standby node promoted and serving on 198.51.100.20
        provider_metadata:
          endpoint: api.fetch-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_connection_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: restart_provider_connector
    description: 重启 Provider 连接器进程。该操作影响在途请求，由平台运维执行，ToolOps Agent 无权调用。
    risk: high
    requires_approval: true
    allowed_callers: [platform-ops]
    agent_authorized: false
    arguments: [provider_id, idempotency_key]

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。故障自愈后必须通过探测验证再恢复流量。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  restart_provider_connector:
    result: rejected
    reason: caller_not_authorized
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 100
            success_rate: 0.99
            latency_p95_ms: 620
            telemetry_complete: true
            error_types: []
          - sample_count: 100
            success_rate: 0.99
            latency_p95_ms: 620
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 100, success_rate: 0.99, latency_p95_ms: 620, telemetry_complete: true, error_types: []}
      - {sample_count: 100, success_rate: 0.99, latency_p95_ms: 620, telemetry_complete: true, error_types: []}
      - {sample_count: 100, success_rate: 0.99, latency_p95_ms: 620, telemetry_complete: true, error_types: []}
      - {sample_count: 100, success_rate: 0.99, latency_p95_ms: 620, telemetry_complete: true, error_types: []}
