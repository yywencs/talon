schema_version: toolops-scenario/v1.1

metadata:
  id: mapping-pool-rebuild-001
  title: generate_video 回滚配置后错误率仅部分恢复
  category: config_regression
  difficulty: intermediate
  tags: [mapping, connection_pool, two_cycles, probe]

clock:
  start_at: 2026-08-11T09:00:00Z
  tick: 1m
  end_after: 50m

initial_state:
  service:
    id: media-service
    tool: generate_video
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 4000
      cost_per_success_max: 0.08
    routes:
      - id: route-a
        provider: provider-media-a
        weight: 75
        enabled: true
      - id: route-b
        provider: provider-media-b
        weight: 25
        enabled: true
  providers:
    - id: provider-media-a
      health: healthy
      endpoint: api.media-a.example
    - id: provider-media-b
      health: healthy
      endpoint: api.media-b.example
  traffic:
    requests_per_minute: 80
    success_rate: 0.99
    latency_p95_ms: 1500
    cost_per_success: 0.06
  config:
    current_version: mapping-v1
    known_healthy_versions: [mapping-v1]
  connection:
    provider-media-a:
      pool_generation: 20
      resolver_cache_generation: 6
      resolved_ip: 203.0.113.10

controller:
  detection_policy:
    window: 5m
    min_requests: 80
    trigger_when:
      error_rate_gte: 0.10
  protection_policy:
    downweight_route_to: 10
    redistribute_to: route-b
    open_circuit_when:
      error_rate_gte: 0.30
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 60
    healthy_windows_required: 3
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 4000
      cost_per_success_lte: 0.08
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      new_error_type: true

agent_policy:
  remediation_cycle_limit: 3
  incident_time_limit: 40m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - possible_data_corruption
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed
    - blast_radius_expanding

timeline:
  - at: 5m
    event: config.publish
    target: generate_video
    values:
      version: mapping-v3
      internal_cause: connector_pool_rebuilt_from_regressed_mapping
      internal_effect:
        route: route-a
        success_rate: 0.70
        latency_p95_ms: 2600
        error_type: invalid_response_schema
      telemetry:
        logs:
          - level: error
            component: mapping-runtime
            code: invalid_response_schema
            message: response field resolution expected integer but received string
        traces:
          - id: trace-pool-001
            route: route-a
            terminal_span: mapping.validate_response
            provider_request_sent: true
        change_record:
          id: change-mapping-v3
          kind: mapping_publish
          version: mapping-v3
          previous_version: mapping-v1
          actor: deployment-service

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_config_versions
    - get_change_records
    - get_connection_metadata
    - get_recovery_policies
  metrics:
    window: 5m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 20
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.1
  changes:
    lookback: 24h
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: rollback_mapping
    description: 将工具映射配置回滚到一个已知健康版本。仅修复映射配置本身，不会重建已从回归配置生成的连接池。
    risk: medium
    requires_approval: true
    arguments: [tool_id, target_version, expected_version, idempotency_key]
    preconditions:
      target_version_must_be_known_healthy: true
    effect:
      restore_config_effects_from: target_version
    compensating_action: restore_previous_version
  - name: recreate_provider_connection_pool
    description: 重建 Provider 连接池并清理进程内缓存。仅在回滚后探测仍失败且出现陈旧连接池证据时使用。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    preconditions:
      refresh_failed_probe_required: true
    effect:
      create_new_pool: true
      clear_process_dns_cache: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复完成后必须通过探测验证，Agent 不能直接指定流量比例。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rollback_mapping:
    result: success
    completion_delay: 1m
    world_effect:
      config_version: mapping-v1
      success_rate: 0.85
      latency_p95_ms: 1800
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 21
      resolver_cache_generation: 7
      resolved_ip: 203.0.113.10
      success_rate: 0.99
      latency_p95_ms: 1500
      error_type_cleared: invalid_response_schema
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 60
            success_rate: 0.85
            latency_p95_ms: 1800
            cost_per_success: 0.06
            telemetry_complete: true
            error_types: [invalid_response_schema]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: provider-connector
                  code: stale_pool_generation
                  message: connection pool generation 20 was built from regressed mapping-v3 and still serves old response parsing
      - steps:
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 1500
            cost_per_success: 0.06
            telemetry_complete: true
            error_types: []
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 1500
            cost_per_success: 0.06
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 1500, cost_per_success: 0.06, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 1500, cost_per_success: 0.06, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 1500, cost_per_success: 0.06, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 1500, cost_per_success: 0.06, telemetry_complete: true, error_types: []}
