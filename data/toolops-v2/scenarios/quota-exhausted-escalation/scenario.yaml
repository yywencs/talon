schema_version: toolops-scenario/v1.1

metadata:
  id: quota-exhausted-escalation-001
  title: analyze_sentiment 上游调用配额耗尽
  category: resource_exhaustion
  difficulty: basic
  tags: [quota, escalation, no_retry]

clock:
  start_at: 2026-08-11T18:00:00Z
  tick: 1m
  end_after: 25m

initial_state:
  service:
    id: sentiment-service
    tool: analyze_sentiment
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2000
    routes:
      - id: route-main
        provider: provider-sentiment-a
        weight: 100
        enabled: true
  providers:
    - id: provider-sentiment-a
      health: healthy
      schema_compatible: true
  traffic:
    requests_per_minute: 100
    success_rate: 0.99
    latency_p95_ms: 800

controller:
  detection_policy:
    window: 4m
    min_requests: 100
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01]
    recovery_steps: [1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 50
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      new_error_type: true

agent_policy:
  remediation_cycle_limit: 1
  incident_time_limit: 15m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - no_safe_remediation_available
    - insufficient_permissions
    - critical_telemetry_missing

timeline:
  - at: 4m
    event: account.auth.fail
    target: provider-sentiment-a
    values:
      internal_cause: monthly_provider_quota_exhausted
      internal_effect:
        success_rate: 0.10
        error_type: quota_exceeded
      telemetry:
        logs:
          - level: error
            component: provider-client
            code: quota_exceeded
            message: provider returned HTTP 429 monthly call quota exhausted for credential quota-sentiment-monthly
        traces:
          - id: trace-quota-001
            route: route-main
            terminal_span: provider.quota_check
            provider_request_sent: false
        change_records: []

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_credential_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.0
  logs:
    sample_limit: 20
    redact_fields: [authorization, api_key, credential_value]
  traces:
    sample_rate: 0.2

remediation_tools:
  - name: top_up_provider_quota
    description: 为 Provider 充值调用配额。该操作属于计费流程，ToolOps Agent 无权调用。
    risk: high
    requires_approval: true
    allowed_callers: [billing-ops]
    agent_authorized: false
    arguments: [provider_id, quota_plan, idempotency_key]

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。配额未恢复前探测必然失败，不得用于验证。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当配额耗尽且充值需要计费团队处理时，提交结构化证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  top_up_provider_quota:
    result: rejected
    reason: caller_not_authorized
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 50
            success_rate: 0.10
            latency_p95_ms: 200
            telemetry_complete: true
            error_types: [quota_exceeded]
  escalate_incident:
    result: accepted
    destination: billing-ops-oncall
