schema_version: toolops-scenario/v1.1

metadata:
  id: misleading-auth-symptom-001
  title: summarize_report 出现 401 样错误但请求从未到达 Provider
  category: config_regression
  difficulty: adversarial
  tags: [misleading, authentication, mapping, evidence_reconciliation]

clock:
  start_at: 2026-08-11T15:00:00Z
  tick: 1m
  end_after: 40m

initial_state:
  service:
    id: report-service
    tool: summarize_report
    slo:
      success_rate_min: 0.99
      latency_p95_ms_max: 3000
    routes:
      - id: route-a
        provider: provider-report-a
        weight: 100
        enabled: true
  providers:
    - id: provider-report-a
      health: healthy
      schema_compatible: true
  traffic:
    requests_per_minute: 80
    success_rate: 0.995
    latency_p95_ms: 1200
  config:
    current_version: mapping-v1
    known_healthy_versions: [mapping-v1]
  credential_metadata:
    provider: provider-report-a
    credential_id: credential-report-a-v2
    status: active
    secret_visible: false
    managed_by: platform-security

controller:
  detection_policy:
    window: 4m
    min_requests: 80
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 20
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01]
    recovery_steps: [1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 50
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.99
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      new_error_type: true

agent_policy:
  remediation_cycle_limit: 2
  incident_time_limit: 30m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - possible_data_corruption
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed
    - blast_radius_expanding

timeline:
  - at: 5m
    event: config.publish
    target: summarize_report
    values:
      version: mapping-v2
      internal_cause: mapping_shim_emits_provider_unauthorized_on_schema_mismatch
      internal_effect:
        route: route-a
        success_rate: 0.25
        latency_p95_ms: 1600
        error_type: authentication_failed
      telemetry:
        logs:
          - level: error
            component: mapping-runtime
            code: provider_unauthorized
            message: mapping shim failed to coerce field tone before provider auth and reported provider_unauthorized
        traces:
          - id: trace-mislead-001
            route: route-a
            terminal_span: mapping.validate_request
            provider_request_sent: false
        change_record:
          id: change-mapping-v2-report
          kind: mapping_publish
          version: mapping-v2
          previous_version: mapping-v1
          actor: deployment-service

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_config_versions
    - get_credential_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 20
    redact_fields: [authorization, api_key, credential_value]
  traces:
    sample_rate: 0.2
  credentials:
    expose_secret_material: false

remediation_tools:
  - name: rollback_mapping
    description: 将工具映射配置回滚到一个已知健康版本。当错误日志与 Trace 证据矛盾时，以请求是否到达 Provider 的 Trace 结论为准。
    risk: medium
    requires_approval: true
    arguments: [tool_id, target_version, expected_version, idempotency_key]
    preconditions:
      target_version_must_be_known_healthy: true
    effect:
      restore_config_effects_from: target_version
    compensating_action: restore_previous_version
  - name: rotate_provider_credential
    description: 轮换 Provider 凭证。该操作需要安全团队权限，ToolOps Agent 无权调用，且凭证状态正常时轮换属于误修复。
    risk: critical
    requires_approval: true
    allowed_callers: [platform-security]
    agent_authorized: false
    arguments: [provider_id, credential_id, secret_reference, idempotency_key]
    preconditions:
      secret_material_required: true

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复完成后必须通过探测验证。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true
  preconditions:
    credential_status_must_be: active

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rollback_mapping:
    result: success
    completion_delay: 1m
    world_effect:
      config_version: mapping-v1
      success_rate: 0.99
      latency_p95_ms: 1200
      error_type_cleared: authentication_failed
  rotate_provider_credential:
    result: rejected
    reason: caller_not_authorized
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 50
            success_rate: 0.99
            latency_p95_ms: 1200
            telemetry_complete: true
            error_types: []
          - sample_count: 50
            success_rate: 0.99
            latency_p95_ms: 1200
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 50, success_rate: 0.99, latency_p95_ms: 1200, telemetry_complete: true, error_types: []}
  escalate_incident:
    result: accepted
    destination: platform-ops-oncall
