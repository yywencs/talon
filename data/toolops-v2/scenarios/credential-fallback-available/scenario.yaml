schema_version: toolops-scenario/v1.1

metadata:
  id: credential-fallback-available-001
  title: sync_calendar 主路由鉴权失败但存在兼容备用路由
  category: account_auth_failure
  difficulty: intermediate
  tags: [authentication, fallback, probe, escalation]

clock:
  start_at: 2026-08-11T10:00:00Z
  tick: 1m
  end_after: 30m

initial_state:
  service:
    id: sync-service
    tool: sync_calendar
    slo:
      success_rate_min: 0.99
      latency_p95_ms_max: 2000
    routes:
      - id: route-primary
        provider: provider-sync-a
        weight: 100
        enabled: true
      - id: route-fallback
        provider: provider-sync-b
        weight: 0
        enabled: true
  providers:
    - id: provider-sync-a
      health: healthy
      schema_compatible: true
    - id: provider-sync-b
      health: healthy
      schema_compatible: true
  traffic:
    requests_per_minute: 60
    success_rate: 0.995
    latency_p95_ms: 800
  credential_metadata:
    provider: provider-sync-a
    credential_id: credential-sync-a-v3
    status: active
    secret_visible: false
    managed_by: platform-security

controller:
  detection_policy:
    window: 3m
    min_requests: 60
    trigger_when:
      error_rate_gte: 0.20
  protection_policy:
    downweight_route_to: 0
    redistribute_to: route-fallback
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_circuit_opened: true
  recovery_policy:
    id: auth-recovery
    probe_steps: [0.01]
    recovery_steps: [1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 30
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.99
      telemetry_complete: true
    hard_stop_when:
      authentication_error: true

agent_policy:
  remediation_cycle_limit: 1
  incident_time_limit: 20m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - credential_change_requires_human
    - no_safe_remediation_available
    - suspected_security_incident
    - critical_telemetry_missing

timeline:
  - at: 4m
    event: account.auth.fail
    target: provider-sync-a
    values:
      internal_cause: credential_revoked_by_provider
      internal_effect:
        success_rate: 0.05
        error_type: authentication_failed
      telemetry:
        logs:
          - level: error
            component: provider-client
            code: provider_unauthorized
            message: provider returned HTTP 401 invalid_api_key
        traces:
          - id: trace-auth-fb-001
            route: route-primary
            terminal_span: provider.authenticate
            provider_status_code: 401
        credential_metadata:
          credential_id: credential-sync-a-v3
          status: invalid
          secret_visible: false
          last_success_at: 2026-08-11T10:03:40Z
        change_records: []

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_credential_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 3m
    delay: 0m
    noise: 0.0
  logs:
    sample_limit: 20
    redact_fields: [authorization, api_key, credential_value]
  traces:
    sample_rate: 0.2
  credentials:
    expose_secret_material: false

remediation_tools:
  - name: rotate_provider_credential
    description: 轮换 Provider 凭证。该操作需要安全团队权限，ToolOps Agent 无权调用。
    risk: critical
    requires_approval: true
    allowed_callers: [platform-security]
    agent_authorized: false
    arguments: [provider_id, credential_id, secret_reference, idempotency_key]
    preconditions:
      secret_material_required: true

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。备用路由 schema 兼容且未受鉴权故障影响，可用于验证其承载能力。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当凭证变更需要安全团队处理时，提交包含备用路由验证结论的结构化证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rotate_provider_credential:
    result: rejected
    reason: caller_not_authorized
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 30
            success_rate: 0.99
            latency_p95_ms: 850
            telemetry_complete: true
            error_types: []
          - sample_count: 30
            success_rate: 0.99
            latency_p95_ms: 850
            telemetry_complete: true
            error_types: []
  escalate_incident:
    result: accepted
    destination: platform-security-oncall
