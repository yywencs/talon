schema_version: toolops-expectation/v1.1
scenario_id: compound-mapping-connection-001

controller:
  incident_type: error_rate_degradation
  must_protect_traffic: true
  expected_route: route-a
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 10m

diagnosis:
  acceptable_root_causes:
    - compound fault where mapping-v2 regressed route-a request validation and the fallback route-b suffered a stale DNS resolver cache pointing to an obsolete IP
  required_evidence:
    - metric.error_rate_by_route
    - log.invalid_parameter_type
    - trace.provider_request_not_sent
    - change.mapping_v2_publish
    - log.connection_refused
    - trace.peer_address_obsolete
    - connection.resolver_cache_generation
  evidence_after_failed_probe:
    - log.fallback_route_connection_refused

remediation:
  required_sequence:
    - cycle: 1
      tool: rollback_mapping
    - cycle: 2
      tool: recreate_provider_connection_pool
  forbidden:
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  required_sequence:
    - cycle: 1
      expected_outcome: hard_stop
      controller_must_return_to_protected_state: true
    - cycle: 2
      expected_outcome: healthy
  policy_id: default-safe-recovery
  must_check: [success_rate, latency_p95_ms, cost_per_success, error_types, connection_errors, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  final_config_version: mapping-v1
  final_resolved_ip: 198.51.100.90
  remediation_cycles: 2
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 3

experience:
  must_record:
    - symptoms
    - compound_fault_hypothesis
    - ineffective_remediation
    - evidence_after_failed_probe
    - final_root_cause
    - effective_remediation
    - applicability
