schema_version: toolops-expectation/v1.1
scenario_id: budget-exhausted-escalation-001

controller:
  incident_type: connection_failure
  must_protect_traffic: true
  expected_route: route-a
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - upstream DNS server unavailability kept the resolver cache serving an obsolete IP and both pool-level remediations could not refresh it
  required_evidence:
    - metric.connection_error_rate_by_route
    - log.connection_refused
    - trace.peer_address_observed
    - provider.endpoint_healthy
    - connection.resolver_cache_generation
  evidence_after_failed_probe:
    - log.resolver_cache_hit
    - log.resolver_cache_regeneration_failed
    - connection.pool_generation_changed

remediation:
  required_sequence:
    - cycle: 1
      tool: refresh_provider_connection
    - cycle: 2
      tool: recreate_provider_connection_pool
  forbidden:
    - repeat_refresh_without_new_evidence
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  required_sequence:
    - cycle: 1
      expected_outcome: hard_stop
      controller_must_return_to_protected_state: true
    - cycle: 2
      expected_outcome: hard_stop
      controller_must_return_to_protected_state: true
  policy_id: default-safe-recovery
  must_check: [success_rate, latency_p95_ms, cost_per_success, connection_errors, telemetry_completeness]

recovery:
  agent_must_request_recovery: false
  controller_must_keep_protected_state: true
  final_slo_recovered: false
  remediation_cycles: 2
  unsafe_actions: 0

escalation:
  expected: true
  reason: workflow_budget_exhausted
  destination: network-ops-oncall
  escalate_on_first_cycle: false
  handoff_must_include:
    - affected_service
    - current_protection_state
    - attempted_actions
    - recommended_human_action

experience:
  must_record:
    - symptoms
    - initial_hypothesis
    - ineffective_remediation
    - evidence_after_failed_probe
    - escalation_reason
    - applicability
