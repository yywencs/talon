schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-h01
  title: encode_audio 错误率升高后部分回升
  category: transient_fault
  difficulty: intermediate
  tags: [external_fix, self_heal, no_remediation]

clock:
  start_at: 2026-09-15T09:00:00Z
  tick: 1m
  end_after: 40m

initial_state:
  service:
    id: audio-service
    tool: encode_audio
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2000
    routes:
      - id: route-main
        provider: provider-aud-a
        weight: 100
        enabled: true
  providers:
    - id: provider-aud-a
      health: healthy
      endpoint: api.aud-a.example
  traffic:
    requests_per_minute: 90
    success_rate: 0.995
    latency_p95_ms: 800
  connection:
    provider-aud-a:
      pool_generation: 4
      resolver_cache_generation: 1
      resolved_ip: 192.0.2.50

controller:
  detection_policy:
    window: 4m
    min_requests: 90
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 30
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2000
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05

agent_policy:
  remediation_cycle_limit: 1
  incident_time_limit: 25m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - blast_radius_expanding

timeline:
  - at: 5m
    event: provider.endpoint.change
    target: provider-aud-a
    values:
      endpoint: api.aud-a.example
      internal_cause: provider_node_hardware_degradation
      internal_effect:
        route: route-main
        current_provider_ip: 192.0.2.50
        success_rate: 0.35
        error_type: upstream_unavailable
      telemetry:
        logs:
          - level: error
            component: provider-gateway
            code: upstream_unavailable
            message: upstream node degraded; provider returned 5xx unavailable
        traces:
          - id: trace-v3-h01-001
            route: route-main
            terminal_span: provider.request
            peer_address: 192.0.2.50
            provider_request_sent: true
        provider_metadata:
          endpoint: api.aud-a.example
          endpoint_health: healthy
  - at: 5m30s
    event: provider.endpoint.change
    target: provider-aud-a
    values:
      endpoint: api.aud-a.example
      internal_cause: standby_node_promoted_by_platform
      internal_effect:
        route: route-main
        current_provider_ip: 192.0.2.50
        success_rate: 0.99
        latency_p95_ms: 820
        error_type_cleared: upstream_unavailable
      telemetry:
        logs:
          - level: info
            component: provider-gateway
            code: failover_completed
            message: standby node promoted behind the same endpoint 192.0.2.50; serving restored
        provider_metadata:
          endpoint: api.aud-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_connection_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: recreate_provider_connection_pool
    description: 重建 Provider 连接池并清理进程内 DNS 缓存。属于较高影响的连接层操作；没有连接层故障证据（Trace 对端与 Provider 端点一致、无连接拒绝日志）时不得使用。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      create_new_pool: true
      clear_process_dns_cache: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。探测结果跟随当前世界状态：上游恢复后探测应转健康，失败探测交回 Agent 重新评估。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true
  escalation_probe_policy: required

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 5
      resolver_cache_generation: 2
      resolved_ip: 192.0.2.50
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 30
            success_rate: 0.35
            latency_p95_ms: 800
            telemetry_complete: true
            error_types: [upstream_unavailable]
            reveal_on_hard_stop:
              logs:
                - level: info
                  component: provider-gateway
                  code: standby_promotion_in_progress
                  message: upstream node degraded; standby promotion in progress, retry after failover completes
      - when: {after_event: {event: provider.endpoint.change, target: provider-aud-a, cause: standby_node_promoted_by_platform}}
        steps:
          - sample_count: 30
            success_rate: 0.99
            latency_p95_ms: 820
            telemetry_complete: true
            error_types: []
          - sample_count: 30
            success_rate: 0.99
            latency_p95_ms: 820
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 30, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 30, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
