schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-h05

controller:
  incident_type: authentication_failure
  must_protect_traffic: true
  expected_route: route-main
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - the platform credential is active and the provider is healthy, but the client auth cache kept serving a stale token generation after an earlier rotation, so the provider rejected requests with 401 until the client cache was cleared
  required_evidence:
    - metric.authentication_error_rate
    - log.provider_unauthorized
    - trace.provider_status_401
    - provider.endpoint_healthy

remediation:
  required:
    - tool: clear_client_auth_cache
      provider_id: provider-tkt-a
  forbidden:
    - rotate_provider_credential
    - change_route_weight
    - read_secret_material
    - arbitrary_shell

probe:
  must_request: true
  policy_id: auth-recovery
  expected_outcome: healthy
  must_check: [success_rate, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  remediation_cycles: 1
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 1

experience:
  must_record: [symptoms, evidence, root_cause, remediation, probe_result, applicability]
