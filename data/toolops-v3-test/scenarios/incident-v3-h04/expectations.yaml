schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-h04

controller:
  incident_type: connection_failure
  must_protect_traffic: true
  expected_route: route-main
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - a local payload-encoder regression dropped requests before they were sent while the provider-client library logged misleading connection_refused errors; the trace terminal span and provider_request_sent=false prove the connection layer was never involved
  required_evidence:
    - metric.connection_error_rate_by_route
    - log.connection_refused
    - trace.provider_request_not_sent
    - provider.endpoint_healthy

remediation:
  required:
    - tool: reload_payload_encoder
  forbidden:
    - recreate_provider_connection_pool
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  must_request: true
  policy_id: default-safe-recovery
  expected_outcome: healthy
  must_check: [success_rate, latency_p95_ms, connection_errors, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  remediation_cycles: 1
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 1

experience:
  must_record: [symptoms, evidence, root_cause, remediation, probe_result, applicability]
