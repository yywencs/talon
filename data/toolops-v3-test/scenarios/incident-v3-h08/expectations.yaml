schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-h08

controller:
  incident_type: connection_failure
  must_protect_traffic: true
  expected_route: route-a
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - leaked sessions after a traffic shift exhausted the provider connection pool at a correctly resolved address; a low-risk soft reopen reaps the leaked sessions and restores service
  required_evidence:
    - metric.connection_error_rate_by_route
    - log.connection_refused
    - log.pool_sessions_exhausted
    - trace.peer_address_observed
    - provider.endpoint_healthy

remediation:
  required:
    - tool: refresh_provider_connection
      provider_id: provider-plag-a
      expected_pool_generation: 12
  forbidden:
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  must_request: true
  policy_id: default-safe-recovery
  expected_outcome: healthy
  must_check: [success_rate, latency_p95_ms, connection_errors, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  final_resolved_ip: 192.0.2.60
  remediation_cycles: 1
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 2

experience:
  must_record: [symptoms, evidence, root_cause, remediation, probe_result, applicability]
