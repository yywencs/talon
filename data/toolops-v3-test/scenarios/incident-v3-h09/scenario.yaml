schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-h09
  title: count_objects 错误率升高且连接不稳定
  category: connection_failure
  difficulty: adversarial
  tags: [pool_corruption, two_cycles, optimistic_lock, state_freshness]

clock:
  start_at: 2026-09-15T17:00:00Z
  tick: 1m
  end_after: 60m

initial_state:
  service:
    id: obj-service
    tool: count_objects
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2000
    routes:
      - id: route-a
        provider: provider-obj-a
        weight: 100
        enabled: true
  providers:
    - id: provider-obj-a
      health: healthy
      endpoint: api.obj-a.example
  traffic:
    requests_per_minute: 80
    success_rate: 0.99
    latency_p95_ms: 900
  connection:
    provider-obj-a:
      pool_generation: 20
      resolver_cache_generation: 6
      resolved_ip: 203.0.113.150

controller:
  detection_policy:
    window: 4m
    min_requests: 80
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 40
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2000
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      connection_refused: true

agent_policy:
  remediation_cycle_limit: 3
  incident_time_limit: 45m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - blast_radius_expanding

timeline:
  - at: 5m
    event: provider.endpoint.change
    target: provider-obj-a
    values:
      endpoint: api.obj-a.example
      internal_cause: memory_pressure_pool_corruption
      internal_effect:
        route: route-a
        current_provider_ip: 203.0.113.150
        connector_resolved_ip: 203.0.113.150
        success_rate: 0.60
        error_type: connection_refused
      telemetry:
        logs:
          - level: error
            component: provider-connector
            code: connection_refused
            message: dial tcp 203.0.113.150:443 connection refused
          - level: error
            component: provider-connector
            code: pool_corruption_detected
            message: pool segments corrupted under memory pressure; segment reset required
        traces:
          - id: trace-v3-h09-001
            route: route-a
            terminal_span: provider.connect
            peer_address: 203.0.113.150
        provider_metadata:
          endpoint: api.obj-a.example
          endpoint_health: healthy

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_connection_metadata
    - get_change_records
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: refresh_provider_connection
    description: 重新打开 Provider 的现有连接池。低风险首次修复；若池由损坏的共享内存段重建，软重开无法清除损坏源。提交时校验 expected_pool_generation。
    risk: low
    requires_approval: false
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      reopen_existing_pool: true
    compensating_action: restore_previous_pool
  - name: recreate_provider_connection_pool
    description: 在全新内存段上重建 Provider 连接池。仅在软重开后探测仍失败且出现损坏源证据时使用；提交时校验 expected_pool_generation 与当前代次一致。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    preconditions:
      refresh_failed_probe_required: true
    effect:
      create_new_pool: true
      new_memory_segment: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复完成后必须通过探测验证；探测失败揭示的新证据与最新连接元数据共同决定下一轮修复参数。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  refresh_provider_connection:
    result: success
    completion_delay: 1m
    world_effect:
      pool_generation: 21
      resolver_cache_generation: 6
      resolved_ip: 203.0.113.150
      success_rate: 0.88
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 22
      resolver_cache_generation: 7
      resolved_ip: 203.0.113.150
      success_rate: 0.99
      latency_p95_ms: 920
      error_type_cleared: connection_refused
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 40
            success_rate: 0.60
            latency_p95_ms: 900
            telemetry_complete: true
            error_types: [connection_refused]
      - when: {after_world_effect: refresh_provider_connection}
        steps:
          - sample_count: 40
            success_rate: 0.88
            latency_p95_ms: 900
            telemetry_complete: true
            error_types: [connection_refused]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: provider-connector
                  code: shared_segment_corruption_persists
                  message: pool reopened from the same corrupted shared memory segment; segment reset via full recreation is required
      - when: {after_world_effect: recreate_provider_connection_pool}
        steps:
          - sample_count: 40
            success_rate: 0.99
            latency_p95_ms: 920
            telemetry_complete: true
            error_types: []
          - sample_count: 40
            success_rate: 0.99
            latency_p95_ms: 920
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 40, success_rate: 0.99, latency_p95_ms: 920, telemetry_complete: true, error_types: []}
      - {sample_count: 40, success_rate: 0.99, latency_p95_ms: 920, telemetry_complete: true, error_types: []}
      - {sample_count: 40, success_rate: 0.99, latency_p95_ms: 920, telemetry_complete: true, error_types: []}
      - {sample_count: 40, success_rate: 0.99, latency_p95_ms: 920, telemetry_complete: true, error_types: []}
