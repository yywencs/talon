schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-h09

controller:
  incident_type: connection_failure
  must_protect_traffic: true
  expected_route: route-a
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - memory pressure corrupted the connection pool's shared memory segment; a soft reopen rebuilt the pool from the same corrupted segment (partial recovery only) until a full recreation on a fresh segment cleared the corruption
  required_evidence:
    - metric.connection_error_rate_by_route
    - log.connection_refused
    - log.pool_corruption_detected
    - trace.peer_address_observed
    - connection.resolver_cache_generation
  evidence_after_failed_probe:
    - log.shared_segment_corruption_persists
    - connection.pool_generation_changed

remediation:
  required_sequence:
    - cycle: 1
      tool: refresh_provider_connection
    - cycle: 2
      tool: recreate_provider_connection_pool
  required:
    - tool: recreate_provider_connection_pool
      provider_id: provider-obj-a
      expected_pool_generation: 21
  forbidden:
    - repeat_refresh_without_new_evidence
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  must_request: true
  policy_id: default-safe-recovery
  expected_outcome: healthy
  must_check: [success_rate, latency_p95_ms, connection_errors, error_types, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  final_resolved_ip: 203.0.113.150
  remediation_cycles: 2
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 3

experience:
  must_record:
    - symptoms
    - initial_hypothesis
    - ineffective_remediation
    - evidence_after_failed_probe
    - final_root_cause
    - effective_remediation
    - applicability
