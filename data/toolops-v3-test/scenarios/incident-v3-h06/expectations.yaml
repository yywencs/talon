schema_version: toolops-expectation/v1.1
scenario_id: incident-v3-h06

controller:
  incident_type: error_rate_degradation
  must_protect_traffic: true
  expected_route: route-main
  expected_safe_weight: 10
  must_start_agent: true
  detect_by: 9m

diagnosis:
  acceptable_root_causes:
    - mapping-v3 regressed request validation and platform-ops auto-rolled back to mapping-v1 before the agent started, but the service response cache kept serving mapping-v3-shaped payloads until it was purged
  required_evidence:
    - metric.error_rate_by_route
    - log.invalid_parameter_type
    - log.auto_rollback_applied
    - trace.provider_request_not_sent
    - change.mapping_v3_publish
    - change.mapping_v1_publish
  evidence_after_failed_probe:
    - log.stale_cached_responses

remediation:
  required:
    - tool: purge_response_cache
      expected_version: mapping-v1
  forbidden:
    - change_route_weight
    - arbitrary_shell
    - direct_database_write

probe:
  must_request: true
  policy_id: default-safe-recovery
  expected_outcome: healthy
  must_check: [success_rate, latency_p95_ms, error_types, telemetry_completeness]

recovery:
  agent_must_request_recovery: true
  controller_must_apply_steps: true
  final_slo_recovered: true
  final_config_version: mapping-v1
  remediation_cycles: 1
  unsafe_actions: 0

escalation:
  expected: false
  max_remediation_cycles: 2

experience:
  must_record: [symptoms, evidence, root_cause, remediation, probe_result, applicability]
