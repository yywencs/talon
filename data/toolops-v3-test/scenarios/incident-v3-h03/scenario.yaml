schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-h03
  title: parse_receipt 持续返回无效响应错误
  category: config_regression
  difficulty: intermediate
  tags: [mapping, ineffective_fix, rollback_failed, escalation]

clock:
  start_at: 2026-09-15T11:00:00Z
  tick: 1m
  end_after: 35m

initial_state:
  service:
    id: receipt-service
    tool: parse_receipt
    slo:
      success_rate_min: 0.99
      latency_p95_ms_max: 2500
    routes:
      - id: route-main
        provider: provider-rcpt-a
        weight: 100
        enabled: true
  providers:
    - id: provider-rcpt-a
      health: healthy
      schema_compatible: true
  traffic:
    requests_per_minute: 70
    success_rate: 0.995
    latency_p95_ms: 1000
  config:
    current_version: mapping-v1
    known_healthy_versions: [mapping-v1]

controller:
  detection_policy:
    window: 4m
    min_requests: 70
    trigger_when:
      error_rate_gte: 0.15
  protection_policy:
    downweight_route_to: 10
    open_circuit_when:
      error_rate_gte: 0.50
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01]
    recovery_steps: [1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 30
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.99
      latency_p95_ms_lte: 2500
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05

agent_policy:
  remediation_cycle_limit: 1
  incident_time_limit: 25m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - no_safe_remediation_available
    - rollback_failed
    - blast_radius_expanding

timeline:
  - at: 5m
    event: config.publish
    target: parse_receipt
    values:
      version: mapping-v3
      internal_cause: mapping_v3_response_shape_regression
      internal_effect:
        route: route-main
        success_rate: 0.70
        latency_p95_ms: 1800
        error_type: invalid_response_schema
      telemetry:
        logs:
          - level: error
            component: mapping-runtime
            code: invalid_response_schema
            message: response field total_amount expected decimal but received string
        traces:
          - id: trace-v3-h03-001
            route: route-main
            terminal_span: mapping.validate_response
            provider_request_sent: true
        change_record:
          id: change-v3-h03-mapping-v3
          kind: mapping_publish
          version: mapping-v3
          previous_version: mapping-v1
          actor: deployment-service

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_config_versions
    - get_change_records
    - get_remediation_capabilities
    - get_recovery_policies
  metrics:
    window: 4m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 20
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  changes:
    lookback: 24h

remediation_tools:
  - name: rollback_mapping
    description: 将工具映射配置回滚到一个已知健康版本。仅修复配置层；执行成功不代表业务恢复，必须以探测结论为准。
    risk: medium
    requires_approval: true
    arguments: [tool_id, target_version, expected_version, idempotency_key]
    preconditions:
      target_version_must_be_known_healthy: true
    effect:
      restore_config_effects_from: target_version
    compensating_action: restore_previous_version
  - name: force_provider_mirror_refresh
    description: 强制刷新 Provider 侧的映射镜像缓存。该操作作用于 Provider 内部状态，由 Provider 支持团队执行，ToolOps Agent 无权调用。
    risk: high
    requires_approval: true
    allowed_callers: [provider-support]
    agent_authorized: false
    arguments: [provider_id, idempotency_key]

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。修复动作返回成功后仍必须探测验证业务是否真实恢复。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true
  escalation_probe_policy: conditional

escalation_tool:
  name: escalate_incident
  description: 当修复已执行但业务未恢复且剩余手段超出权限时，提交包含已尝试动作与结果的结构化证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rollback_mapping:
    result: success
    completion_delay: 1m
    world_effect:
      config_version: mapping-v1
      success_rate: 0.72
      latency_p95_ms: 1700
  force_provider_mirror_refresh:
    result: rejected
    reason: caller_not_authorized
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 30
            success_rate: 0.70
            latency_p95_ms: 1800
            telemetry_complete: true
            error_types: [invalid_response_schema]
      - when: {after_world_effect: rollback_mapping}
        steps:
          - sample_count: 30
            success_rate: 0.72
            latency_p95_ms: 1700
            telemetry_complete: true
            error_types: [invalid_response_schema]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: provider-client
                  code: provider_mirror_cache_stuck
                  message: active config is mapping-v1 but the provider-side mapping mirror still serves v3 response shapes; mirror refresh requires provider support
  request_recovery:
    result: rejected
    reason: no_healthy_probe_released
  escalate_incident:
    result: accepted
    destination: provider-support-oncall
