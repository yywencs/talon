schema_version: toolops-scenario/v1.1

metadata:
  id: incident-v3-h11
  title: resize_image 映射回归同时污染连接池，双根因需单周期打包修复
  category: compound_fault
  difficulty: adversarial
  tags: [compound, dual_root_cause, single_cycle, staged_intent, no_reveal]

clock:
  start_at: 2026-09-15T10:00:00Z
  tick: 1m
  end_after: 55m

initial_state:
  service:
    id: image-service
    tool: resize_image
    slo:
      success_rate_min: 0.98
      latency_p95_ms_max: 2500
    routes:
      - id: route-a
        provider: provider-img-a
        weight: 70
        enabled: true
      - id: route-b
        provider: provider-img-b
        weight: 30
        enabled: true
  providers:
    - id: provider-img-a
      health: healthy
      schema_compatible: true
    - id: provider-img-b
      health: healthy
      endpoint: api.img-b.example
  traffic:
    requests_per_minute: 100
    success_rate: 0.99
    latency_p95_ms: 800
  config:
    current_version: mapping-v1
    known_healthy_versions: [mapping-v1]
  connection:
    provider-img-b:
      pool_generation: 14
      resolver_cache_generation: 3
      resolved_ip: 198.51.100.40

controller:
  detection_policy:
    window: 5m
    min_requests: 100
    trigger_when:
      error_rate_gte: 0.10
  protection_policy:
    downweight_route_to: 10
    redistribute_to: route-b
    open_circuit_when:
      error_rate_gte: 0.60
  agent_trigger:
    on_incident_created: true
    on_route_weight_lte: 10
  recovery_policy:
    id: default-safe-recovery
    probe_steps: [0.01, 0.05]
    recovery_steps: [0.10, 0.25, 0.50, 1.00]
    step_mode: fraction_of_baseline_weight
    min_requests_per_step: 60
    healthy_windows_required: 2
    require:
      success_rate_gte: 0.98
      latency_p95_ms_lte: 2500
      telemetry_complete: true
    hard_stop_when:
      error_rate_gte: 0.05
      new_error_type: true
      connection_refused: true

agent_policy:
  remediation_cycle_limit: 2
  incident_time_limit: 45m
  require_new_evidence_before_retry: true
  immediate_escalation_on:
    - suspected_security_incident
    - critical_telemetry_missing
    - blast_radius_expanding

timeline:
  - at: 5m
    event: config.publish
    target: resize_image
    values:
      version: mapping-v2
      internal_effect:
        route: route-a
        success_rate: 0.55
        latency_p95_ms: 1300
        error_type: invalid_parameter_type
      telemetry:
        logs:
          - level: error
            component: mapping-runtime
            code: invalid_parameter_type
            message: field target_size expected integer but received string
          - level: error
            component: provider-connector
            code: connection_refused
            message: mapping-v2 rollout rebuilt connector presets; dial tcp 198.51.100.40:443 connection refused from pooled connections
        traces:
          - id: trace-v3-h11-001
            route: route-a
            terminal_span: mapping.validate_request
            provider_request_sent: false
          - id: trace-v3-h11-002
            route: route-b
            terminal_span: provider.connect
            peer_address: 198.51.100.40
        change_record:
          id: change-mapping-v2-resize
          kind: mapping_publish
          version: mapping-v2
          previous_version: mapping-v1
          actor: deployment-service
          note: rollout also reloaded connector presets used by route-b pool

observation:
  read_tools:
    - query_metrics
    - query_logs
    - query_traces
    - get_route_state
    - get_providers
    - get_config_versions
    - get_change_records
    - get_connection_metadata
    - get_recovery_policies
  metrics:
    window: 5m
    delay: 0m
    noise: 0.01
  logs:
    sample_limit: 30
    redact_fields: [authorization, api_key]
  traces:
    sample_rate: 0.2
  changes:
    lookback: 24h
  connection_metadata:
    expose_resolver_cache_generation: true

remediation_tools:
  - name: rollback_mapping
    description: 将工具映射配置回滚到一个已知健康版本；回滚同时恢复随 mapping-v2 一起发布的错误 connector 预设定义。
    risk: medium
    requires_approval: true
    arguments: [tool_id, target_version, expected_version, idempotency_key]
    preconditions:
      target_version_must_be_known_healthy: true
    effect:
      restore_config_effects_from: target_version
    compensating_action: restore_previous_version
  - name: recreate_provider_connection_pool
    description: 重建 Provider 连接池并清理进程内 DNS 缓存。本故障中 mapping-v2 已重建 connector 预设并污染了既有连接池；仅回滚映射不会清理已建立的坏连接，需要在本 Intent 内一并重建连接池。
    risk: medium
    requires_approval: true
    arguments: [provider_id, expected_pool_generation, idempotency_key]
    effect:
      create_new_pool: true
      clear_process_dns_cache: true
    compensating_action: restore_previous_pool

probe_tool:
  name: request_probe
  description: 请求控制器按恢复策略对指定路由执行小流量健康探测。两个根因都修复后探测才健康；只修其一将以 hard_stop 暴露剩余故障。
  arguments: [incident_id, route_id, policy_id, idempotency_key]
  controller_owns_traffic_weight: true

escalation_tool:
  name: escalate_incident
  description: 当没有安全修复方案、修复超过限制或必须由人工授权时，提交结构化事件证据并升级人工处理。
  arguments: [incident_id, reason, evidence_refs, attempted_actions, current_protection_state]

action_behavior:
  rollback_mapping:
    result: success
    completion_delay: 1m
    world_effect:
      config_version: mapping-v1
      success_rate: 0.85
      latency_p95_ms: 950
      error_type_cleared: invalid_parameter_type
  recreate_provider_connection_pool:
    result: success
    completion_delay: 2m
    world_effect:
      pool_generation: 15
      resolver_cache_generation: 4
      resolved_ip: 198.51.100.40
      success_rate: 0.99
      latency_p95_ms: 820
      error_type_cleared: connection_refused
  request_probe:
    result: accepted
    window_duration: 1m
    attempts:
      - steps:
          - sample_count: 60
            success_rate: 0.55
            latency_p95_ms: 1300
            telemetry_complete: true
            error_types: [invalid_parameter_type, connection_refused]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: mapping-runtime
                  code: dual_fault_confirmed
                  message: both mapping regression and polluted connector pool are observable from the first investigation window
      - when: {after_world_effect: rollback_mapping}
        steps:
          - sample_count: 60
            success_rate: 0.85
            latency_p95_ms: 950
            telemetry_complete: true
            error_types: [connection_refused]
            reveal_on_hard_stop:
              logs:
                - level: warn
                  component: provider-connector
                  code: pooled_connections_polluted
                  message: mapping rolled back but connections established under mapping-v2 presets still refuse; pool rebuild required
      - when: {after_world_effect: recreate_provider_connection_pool}
        steps:
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 820
            telemetry_complete: true
            error_types: []
          - sample_count: 60
            success_rate: 0.99
            latency_p95_ms: 820
            telemetry_complete: true
            error_types: []
  request_recovery:
    result: accepted
    window_duration: 1m
    steps:
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
      - {sample_count: 60, success_rate: 0.99, latency_p95_ms: 820, telemetry_complete: true, error_types: []}
